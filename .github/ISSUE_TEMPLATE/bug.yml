name: Bug
description: Quelque chose ne fonctionne pas comme prévu / Something doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Une faille de sécurité ne se signale pas ici : voir SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Affichée dans le menu utilisateur de l'application (ex. 1.0.2)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker (installateur ou Compose)
        - Kubernetes
        - Autre
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Ce que vous avez fait
      description: Les étapes pour reproduire le problème
      placeholder: |
        1. Aller dans …
        2. Cliquer sur …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce que vous attendiez
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Ce qui s'est passé
      description: Message d'erreur, capture d'écran, extrait des journaux de l'API (sans mot de passe ni adresse personnelle)
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Matériel concerné (facultatif)
      description: Contrôleur ESP32, module, sonde…
