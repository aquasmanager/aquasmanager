# Signature du CLA (CLA.md) à la première pull request de chaque contributeur.
# Les signatures sont gardées dans la branche cla-signatures de ce dépôt.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/aquasmanager/aquasmanager/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: aquasmanager,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Merci pour cette contribution ! Avant de pouvoir l'intégrer, merci de lire le
            [CLA](https://github.com/aquasmanager/aquasmanager/blob/main/CLA.md) puis de le signer en
            ajoutant le commentaire ci-dessous (une seule fois pour toutes vos contributions).
            / Thanks! Please read the CLA and sign it by posting the comment below.
          custom-allsigned-prcomment: Tous les contributeurs ont signé le CLA, merci ! / All contributors have signed the CLA.
