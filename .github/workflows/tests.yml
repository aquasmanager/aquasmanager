# Tests de l'API et contrôles de l'interface, à chaque push sur main et à chaque pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Dépendances
        run: pip install -r requirements.txt pytest
      - name: Tests (cœur et pro)
        run: ENV=test python -m pytest

  ui:
    name: Interface
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Dépendances
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx vue-tsc --noEmit -p tsconfig.json
      - name: Traductions
        run: npm run i18n:check
      - name: Build
        run: npx quasar build
