# Schéma vu par le navigateur : celui du proxy HTTPS placé devant (Traefik, Caddy...)
# s'il le transmet, sinon celui de cette connexion. Relayé à l'API (relais /api) :
# sans lui, l'API derrière un proxy HTTPS redirigeait en http:// (bloqué par le navigateur).
map $http_x_forwarded_proto $aquas_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relais optionnel vers l'API (installation Docker), généré au démarrage
    include /etc/nginx/conf.d/api-proxy.inc;

    # Toujours relus : configuration d'exécution et service worker
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Vue Router en mode "history" : toute route inconnue de nginx doit
    # retomber sur index.html pour que Vue Router la prenne en charge
    # côté client (sinon 404 au rafraîchissement d'une page type /users).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Les assets buildés (hash dans le nom de fichier) peuvent être mis en
    # cache longuement sans risque de servir une version obsolète.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # Modules JavaScript .mjs (worker de pdf.js) : absents de mime.types,
        # servis sinon en application/octet-stream, que Chrome refuse d'exécuter
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
