[tox]
envlist = clean,black,py{3.12},report,pylint,bandit

[testenv]
setenv =
    PACKAGE = "AquasManagerApi"
    MAX_LINE_LENGTH = 120
whitelist_externals =
    coverage
deps =
    pytest
    pytest-cov
depends =
    py{3.12}: clean
    report: py{3.12}
    flake8: report
commands =
    pip install -r requirements.txt
    python -V
    coverage --version
    pytest --version
    coverage run -a --branch --omit="*/venv*,*/tests*,setup.py,*/.tox/*,*/.log/*,*/.html/*" -m pytest -s

[testenv:clean]
deps = coverage
commands =
    coverage --version
    coverage erase

[testenv:black]
deps = black
commands =
    black --version
    black -l {env:MAX_LINE_LENGTH} --exclude "\.direnv|\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|\.svn|_build|buck-out|build|dist|venv" .

[testenv:report]
deps = coverage
commands =
    coverage --version
    coverage report -m
    coverage html

[testenv:flake8]
deps=flake8
commands=
    flake --version
    flake8 --count --max-line-length {env:MAX_LINE_LENGTH} --benchmark {env:PACKAGE}

[testenv:pylint]
deps=pylint==2.15.5
commands=
     pylint --version
     pylint --exit-zero --ignore="venv,tests,.tox,setup.py" --max-line-length {env:MAX_LINE_LENGTH} -s yes {env:PACKAGE}

[testenv:bandit]
description = check for potential security risks in source code
deps = bandit
commands = bandit -r dbaas_tools
usedevelop = False

